[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-learning-backend"
version = "0.1.0"
description = "Askora 私人使用的苏格拉底式学习 App 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyJWT[crypto]>=2.10.1,<3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiokafka>=0.10.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "phonenumbers>=8.13.0",
    "jieba>=0.42.1",
    "ebooklib>=0.18",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "faker>=23.0.0",
    "factory-boy>=3.3.0",
    "pip-audit>=2.9.0",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
markers = [
    # CI v2 Required Suite
    "required: v1 Required test suite - must pass for merge",
    "product_boundary: Product Boundary tests - verify v1 product invariants",
    "architecture: Architecture boundary tests",
    "unit: Unit tests - core logic without external dependencies",
    "contract: Contract tests - API/schema compatibility",
    "sqlite_integration: SQLite integration tests - use real SQLite",
    "opve_core: Deterministic OPVE/G0/G1 core tests",
    # CI v2 Optional Suite
    "optional: Optional tests - not blocking merge",
    "historical: Historical/migration tests - evidence only",
    "real_provider: Tests requiring real AI provider",
    "postgres: PostgreSQL compatibility tests",
    "native_desktop: Native desktop tests",
    # Recovery/Rebuild Suite
    "migration: Schema migration tests",
    "recovery: Recovery/restart tests",
    "rebuild: Derived data rebuild tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "S"]
ignore = [
    "B008",  # FastAPI 的 Depends/File/Query 依赖注入写法
    "B904",  # API 边界有意隐藏内部异常链
    "S101",  # 服务断言和测试断言均有合法用途
    "S105",  # bearer/token 类型字符串与示例占位值会被误判为密码
    "S106",  # token_type 参数会被误判为密码
    "S108",  # 独立测试脚本使用固定 /tmp 沙箱并在结束时清理
    "S110",  # 清理/断连的 best-effort 分支允许显式忽略
    "S311",  # 教学题目与措辞随机选择不用于密码学
    "S324",  # MD5 仅作为非安全性的向量缓存键
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"test_*.py" = ["S105", "S106", "S311"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "app/gateway/",
    "app/security.py",
    "app/services/assessment/",
    "app/services/dkt/",
    "app/services/knowledge_graph/",
    "app/workers/",
]
