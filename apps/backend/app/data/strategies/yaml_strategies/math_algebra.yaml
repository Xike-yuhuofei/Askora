    prompt_template: "引导发现：{concept}\n提问：解方程2(x+3)=2x+6后，你发现了什么？这说明了什么？"
    follow_up_strategies: []
    escalation_threshold: 3
    de_escalation_threshold: 2
    version: "2.0.0"
    is_active: true

