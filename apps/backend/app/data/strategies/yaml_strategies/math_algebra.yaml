# 数学·代数策略配置
strategies:
  - id: "yaml_algebra_linear_concept"
    level_1_goal: "core_guidance"
    level_2_skill: "concept_clarification"
    level_3_context: "linear_equations"
    name: "线性方程核心概念"
    description: "理解线性方程ax+b=c的结构和解法"
    prompt_template: "学生正在学习线性方程。引导理解：{concept}\n提问：方程3x+5=14中，x代表什么？如何求x的值？"
    follow_up_strategies: ["yaml_algebra_linear_error"]
    escalation_threshold: 3
    de_escalation_threshold: 2
    version: "2.0.0"
    is_active: true

  - id: "yaml_algebra_linear_error"
    level_1_goal: "monitoring"
    level_2_skill: "error_analysis"
    level_3_context: "linear_equations"
    name: "线性方程错误分析"
    description: "分析移项、计算中的常见错误"
    prompt_template: "学生解线性方程出错。引导分析：{student_state}\n提问：你在移项时是否改变了符号？检查每一步的运算。"
    follow_up_strategies: []
    escalation_threshold: 3
    de_escalation_threshold: 2
    version: "2.0.0"
    is_active: true

  - id: "yaml_algebra_linear_identity"
    level_1_goal: "core_guidance"
