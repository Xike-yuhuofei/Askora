name: Askora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation links and lifecycle state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查文档链接与过时状态
        run: python .github/workflows/check_docs.py

  backend-tests:
    name: Backend tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      PRIVATE_APP: "true"
      DATABASE_URL: sqlite+aiosqlite:///./ci-askora.db
      REDIS_URL: redis://127.0.0.1:6399/0
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      KEK_MASTER_KEY: ci-only-kek-secret-at-least-32-characters
      LLM_QWEN_API_KEY: ""
      LLM_DEEPSEEK_API_KEY: ""
      LLM_DOUBAO_API_KEY: ""
      EMBEDDING_API_KEY: ""
      ENABLE_ORCHESTRATOR_DEBUG_API: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装锁定依赖
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: 测试与覆盖率门禁
        run: |
          uv run pytest tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=45
          uv run python test_document_service.py
          uv run python test_optimizations.py

      - name: 保存覆盖率报告
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          if-no-files-found: error

  backend-quality:
    name: Ruff, formatting and type baseline / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装锁定依赖
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: 静态检查
        run: |
          uv run ruff check app tests scripts test_document_service.py test_optimizations.py
          uv run python ../../.github/workflows/check_black_baseline.py
          uv run mypy app --no-error-summary

  alembic:
    name: Alembic migration validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      PRIVATE_APP: "true"
      DATABASE_URL: sqlite+aiosqlite:///./ci-askora.db
      JWT_SECRET_KEY: ci-only-jwt-secret-at-least-32-characters
      KEK_MASTER_KEY: ci-only-kek-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装锁定依赖
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: 数据库迁移往返验证
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 组件测试与生产构建
        run: |
          npm test -- --run
          npm run build

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 依赖审计
        run: npm audit --audit-level=high

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 审计锁定环境
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev
          uv run pip-audit --progress-spinner=off

  container-build:
    name: Private container build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-quality
      - alembic
      - frontend
      - frontend-dependency-audit
      - dependency-audit
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 仅构建验证，不推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
