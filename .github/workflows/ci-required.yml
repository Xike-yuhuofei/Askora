name: Askora CI / Required

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check documentation links
        run: python .github/workflows/check_docs.py

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      PRIVATE_APP: "true"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: Run required tests
        run: uv run pytest tests/ -m required -v --tb=short

  backend-quality:
    name: Code quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check app tests

      - name: Black check
        run: uv run black --check --diff app tests

      - name: Mypy check
        run: uv run mypy app --no-error-summary

  backend-migration:
    name: Migration validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      PRIVATE_APP: "true"
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev

      - name: Validate migration roundtrip
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    name: Frontend test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: |
          npm test -- --run
          npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python audit
        working-directory: apps/backend
        run: |
          python -m pip install uv==0.9.5
          uv sync --frozen --extra dev
          uv run pip-audit --progress-spinner=off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Frontend audit
        working-directory: apps/frontend
        run: |
          npm ci
          npm audit --audit-level=high

  required-aggregate:
    name: Askora CI / Required
    runs-on: ubuntu-latest
    needs:
      - documentation
      - backend-tests
      - backend-quality
      - backend-migration
      - frontend
      - dependency-audit
    steps:
      - name: Required gate passed
        run: echo "All Required jobs passed."