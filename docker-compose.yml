services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      PRIVATE_APP: "true"
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://askora:${POSTGRES_PASSWORD:?请在根目录 .env 设置 POSTGRES_PASSWORD}@postgres:5432/askora
      REDIS_URL: redis://redis:6379/0
      KEK_MASTER_KEY: ${KEK_MASTER_KEY:?请在根目录 .env 设置 KEK_MASTER_KEY}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-deepseek}
      LLM_DEEPSEEK_API_KEY: ${LLM_DEEPSEEK_API_KEY:-}
      LLM_QWEN_API_KEY: ${LLM_QWEN_API_KEY:-}
      LLM_DOUBAO_API_KEY: ${LLM_DOUBAO_API_KEY:-}
      ENABLE_ORCHESTRATOR_DEBUG_API: "false"
    volumes:
      - document-data:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: askora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: askora
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askora -d askora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  document-data:
  postgres-data:
  redis-data:
