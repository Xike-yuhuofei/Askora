<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button - Askora Design System</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-sans); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; width: 92px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-rule); margin: var(--space-4) 0; }

/* @component-css-start */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; cursor: pointer; font-family: var(--font-sans); font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, filter .15s; flex-shrink: 0; }
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--color-surface-container); color: var(--color-on-surface); }
.btn-secondary:hover { filter: brightness(0.96); }
.btn-ghost { background: transparent; color: var(--color-on-surface); }
.btn-ghost:hover { background: var(--color-surface-container); }
.btn-destructive { background: var(--color-error); color: var(--color-on-primary); }
.btn-destructive:hover { filter: brightness(1.08); }
.btn-pill { border-radius: var(--radius-full); }
.btn-rounded { border-radius: var(--radius-sm); }
.btn-sm { height: var(--size-button-sm); padding: 0 var(--space-3); font-size: 14px; min-width: var(--size-button-sm); }
.btn-md { height: var(--size-button-md); padding: 0 var(--space-5); font-size: var(--font-size-body); min-width: var(--size-button-md); }
.btn-lg { height: var(--size-button-lg); padding: 0 var(--space-6); font-size: var(--font-size-lead); min-width: var(--size-button-lg); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.btn-icon { padding: 0; width: var(--size-button-sm); }
.btn-icon.btn-md { width: var(--size-button-md); }
.btn-icon.btn-lg { width: var(--size-button-lg); }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">Primary</span>
  <button class="btn btn-primary btn-pill btn-md">发送消息</button>
  <button class="btn btn-primary btn-pill btn-md" disabled>发送消息</button>
</div>

<div class="row">
  <span class="label">Secondary</span>
  <button class="btn btn-secondary btn-pill btn-md">添加附件</button>
  <button class="btn btn-secondary btn-pill btn-md" disabled>添加附件</button>
</div>

<div class="row">
  <span class="label">Destructive</span>
  <button class="btn btn-destructive btn-pill btn-md">删除对话</button>
  <button class="btn btn-destructive btn-pill btn-md" disabled>删除对话</button>
</div>

<hr class="divider">

<div class="row">
  <span class="label">Ghost</span>
  <button class="btn btn-ghost btn-rounded btn-sm btn-icon" aria-label="设置">
    <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/settings.svg" width="16" height="16" alt="设置">
  </button>
  <button class="btn btn-ghost btn-pill btn-md">了解更多</button>
  <button class="btn btn-ghost btn-pill btn-md" disabled>了解更多</button>
</div>

<div class="row">
  <span class="label">Sizes</span>
  <button class="btn btn-primary btn-pill btn-sm">创建</button>
  <button class="btn btn-primary btn-pill btn-md">创建知识库</button>
  <button class="btn btn-primary btn-pill btn-lg">创建知识库</button>
</div>

</body>
</html>
