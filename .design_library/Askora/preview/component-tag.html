<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tag - Askora Design System</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-muted-foreground); width: 72px; flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-rule); margin: var(--space-3) 0; }

/* @component-css-start */
.tag { display: inline-flex; align-items: center; gap: var(--space-1); border-radius: var(--radius-full); font-family: var(--font-sans); font-weight: 500; white-space: nowrap; flex-shrink: 0; border: 1px solid transparent; transition: filter .15s, background .15s, border-color .15s; }
.tag.size-md { height: 24px; padding: 0 var(--space-2); font-size: var(--font-size-caption); min-width: 24px; }
.tag.size-sm { height: 20px; padding: 0 var(--space-2); font-size: var(--font-size-caption); min-width: 20px; }
.tag.soft.primary { background: var(--color-primary-container); color: var(--color-on-primary-container); }
.tag.soft.default { background: var(--color-surface-container); color: var(--color-on-surface-variant); }
.tag.filled.success { background: var(--color-success); color: var(--color-on-primary); }
.tag.filled.warning { background: var(--color-warning); color: var(--color-on-primary); }
.tag.filled.error { background: var(--color-error); color: var(--color-on-primary); }
.tag.outlined.default { background: transparent; color: var(--color-on-surface-variant); border-color: var(--color-border); }
.tag.outlined.primary { background: transparent; color: var(--color-primary); border-color: var(--color-primary); }
.tag.interactive { cursor: pointer; }
.tag.interactive:hover { filter: brightness(1.08); }
.tag .tag-icon { width: 14px; height: 14px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; opacity: 0.7; }
.tag .tag-icon img { width: 100%; height: 100%; }
/* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">分类标签</span>
    <span class="tag soft primary size-md">知识库</span>
    <span class="tag soft default size-md">文档</span>
  </div>
  <div class="row">
    <span class="label">状态标签</span>
    <span class="tag filled success size-sm">已同步</span>
    <span class="tag filled warning size-sm">处理中</span>
    <span class="tag filled error size-sm">同步失败</span>
  </div>
  <div class="row">
    <span class="label">描边标签</span>
    <span class="tag outlined default size-sm">已归档</span>
    <span class="tag outlined primary size-sm">精选</span>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">筛选标签</span>
    <span class="tag soft default size-md interactive">产品文档<span class="tag-icon"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/x.svg" alt="移除"></span></span>
    <span class="tag soft primary size-md interactive">API 文档<span class="tag-icon"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/x.svg" alt="移除"></span></span>
  </div>
</body>
</html>
