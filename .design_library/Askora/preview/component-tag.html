<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>标签 Tag</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style data-preview-shell>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-base-font-family);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      font-weight: var(--body-base-font-weight);
      letter-spacing: var(--body-base-letter-spacing);
      min-height: 100%;
      overflow-x: hidden;
      max-width: 100%;
    }
    body { padding: var(--spacer-32); }
    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-family: var(--heading-lg-font-family); font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-family: var(--heading-sm-font-family); font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }
    .row { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; }
    .stack-16 { display: flex; flex-direction: column; gap: var(--spacer-16); }
    @media (max-width: 720px) {
      body { padding: var(--spacer-16); }
    }
  </style>
  <link rel="stylesheet" href="../components-group-a.css" />
  <style>
    body { width: min(100%, 1184px); margin: 0 auto; padding: var(--spacer-40) var(--spacer-32) var(--spacer-48); }
    .pv-section { padding-top: var(--spacer-24); border-top: 1px solid var(--border-neutral-l1); }
    .pv-header + .pv-section { padding-top: 0; border-top: 0; }
  </style>
</head>
<body>
  <div class="pv-header">
    <h1>标签 Tag</h1>
    <p>
      用于状态、分类或短标签的轻量标记。支持中性、品牌蓝、成功、警告、错误与描边样式，可带圆点或可关闭按钮。
    </p>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">语义样式</div>
    <div class="row">
      <span class="ak-tag ak-tag--neutral">未开始</span>
      <span class="ak-tag ak-tag--brand">已掌握</span>
      <span class="ak-tag ak-tag--success">进行中</span>
      <span class="ak-tag ak-tag--warning">需加强</span>
      <span class="ak-tag ak-tag--error">已逾期</span>
    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">描边样式</div>
    <div class="row">
      <span class="ak-tag ak-tag--outline">草稿</span>
      <span class="ak-tag ak-tag--brand-outline">精选</span>
    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">带圆点与可关闭</div>
    <div class="row">
      <span class="ak-tag ak-tag--success"><span class="ak-tag__dot"></span>在线</span>
      <span class="ak-tag ak-tag--warning"><span class="ak-tag__dot"></span>待处理</span>
      <span class="ak-tag ak-tag--neutral">线性代数<button class="ak-tag__close" aria-label="移除">×</button></span>
      <span class="ak-tag ak-tag--brand">概率论<button class="ak-tag__close" aria-label="移除">×</button></span>
    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">尺寸</div>
    <div class="stack-16">
      <div class="row">
        <span class="ak-tag ak-tag--brand ak-tag--sm">小标签</span>
        <span class="ak-tag ak-tag--success ak-tag--sm">小标签</span>
      </div>
      <div class="row">
        <span class="ak-tag ak-tag--brand">默认标签</span>
        <span class="ak-tag ak-tag--success">默认标签</span>
      </div>
      <div class="row">
        <span class="ak-tag ak-tag--brand ak-tag--lg">大标签</span>
        <span class="ak-tag ak-tag--success ak-tag--lg">大标签</span>
      </div>
    </div>
  </div>
</body>
</html>
