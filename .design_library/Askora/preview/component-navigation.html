<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation - Askora</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
body{margin:0;padding:var(--space-3);background:var(--color-background);font-family:var(--font-sans);color:var(--color-on-surface);}
.row{display:flex;gap:var(--space-2);align-items:flex-start;margin-bottom:var(--space-2);flex-wrap:wrap;}
.label{width:92px;flex-shrink:0;font-size:var(--font-size-caption);color:var(--color-muted-foreground);text-transform:uppercase;letter-spacing:.05em;padding-top:10px;}
.divider{border:none;border-top:1px solid var(--color-rule);margin:var(--space-4) 0;}
/* @component-css-start */
.sidebar{width:260px;background:var(--color-sidebar);color:var(--color-sidebar-text);display:flex;flex-direction:column;height:480px;border-radius:var(--radius-lg);overflow:hidden;flex-shrink:0;}
.sidebar-header{padding:var(--space-4) var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:var(--space-3);border-bottom:1px solid var(--color-border);}
.workspace-switcher{display:flex;align-items:center;gap:var(--space-2);cursor:pointer;padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);transition:background .15s;}
.workspace-switcher:hover{background:var(--color-sidebar-hover);}
.workspace-name{font-weight:600;font-size:var(--font-size-body);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.new-chat-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:var(--size-button-md);padding:0 var(--space-4);background:var(--color-primary);color:var(--color-on-primary);border:none;border-radius:var(--radius-md);font-size:var(--font-size-body);font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap;}
.new-chat-btn:hover{filter:brightness(1.08);}
.nav-section{padding:var(--space-3) var(--space-2);flex:1;overflow-y:auto;}
.nav-section-title{font-size:var(--font-size-caption);font-weight:600;color:var(--color-muted-foreground);text-transform:uppercase;letter-spacing:.05em;padding:var(--space-1) var(--space-2);margin-bottom:var(--space-1);}
.nav-item{display:flex;align-items:center;gap:var(--space-2);height:40px;padding:0 var(--space-2);border-radius:var(--radius-sm);cursor:pointer;position:relative;transition:background .15s;margin-bottom:2px;}
.nav-item:hover{background:var(--color-sidebar-hover);}
.nav-item.active{background:var(--color-sidebar-active);font-weight:600;}
.nav-item.active::before{content:"";position:absolute;left:calc(-1 * var(--space-2));top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--color-primary);border-radius:0 3px 3px 0;}
.nav-item.disabled{opacity:.4;cursor:not-allowed;}
.nav-item.disabled:hover{background:transparent;}
.nav-item-icon{width:var(--size-icon-md);height:var(--size-icon-md);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--color-on-surface-variant);}
.nav-item.active .nav-item-icon{color:var(--color-primary);}
.nav-item-label{flex:1;font-size:var(--font-size-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.nav-item-meta{font-size:var(--font-size-caption);color:var(--color-muted-foreground);flex-shrink:0;}
.nav-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;background:var(--color-primary);color:var(--color-on-primary);font-size:11px;font-weight:600;border-radius:var(--radius-full);flex-shrink:0;}
.nav-item-actions{display:flex;gap:var(--space-1);opacity:0;transition:opacity .15s;flex-shrink:0;}
.nav-item:hover .nav-item-actions{opacity:1;}
.nav-action-btn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--color-muted-foreground);cursor:pointer;border-radius:var(--radius-sm);transition:background .15s;}
.nav-action-btn:hover{background:var(--color-sidebar-hover);color:var(--color-on-surface);}
.nav-group-header{display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-2);cursor:pointer;border-radius:var(--radius-sm);transition:background .15s;margin-bottom:2px;}
.nav-group-header:hover{background:var(--color-sidebar-hover);}
.nav-group-header .chevron{width:16px;height:16px;flex-shrink:0;color:var(--color-muted-foreground);transition:transform .2s;}
.nav-group-header.collapsed .chevron{transform:rotate(-90deg);}
.nav-group-title{flex:1;font-size:var(--font-size-body);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-group-children{padding-left:var(--space-6);margin-top:2px;}
.nav-group-children .nav-item{height:36px;}
.sidebar-footer{padding:var(--space-3) var(--space-2);border-top:1px solid var(--color-border);display:flex;flex-direction:column;gap:2px;}
.user-profile{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;}
.user-profile:hover{background:var(--color-sidebar-hover);}
.user-avatar{width:32px;height:32px;border-radius:var(--radius-full);background:var(--color-primary);color:var(--color-on-primary);display:flex;align-items:center;justify-content:center;font-size:var(--font-size-caption);font-weight:600;flex-shrink:0;}
.user-info{flex:1;min-width:0;}
.user-name{font-size:var(--font-size-body);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:var(--font-size-caption);color:var(--color-muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-sample-row{display:flex;flex-direction:column;gap:var(--space-1);width:260px;flex-shrink:0;}
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">完整侧边栏</span>
  <nav class="sidebar" aria-label="主导航">
    <div class="sidebar-header">
      <div class="workspace-switcher">
        <span class="workspace-name">Askora 工作区</span>
        <i data-lucide="chevron-down" style="width:16px;height:16px;color:var(--color-muted-foreground)"></i>
      </div>
      <button class="new-chat-btn">
        <i data-lucide="plus" style="width:16px;height:16px"></i>
        新建对话
      </button>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">对话</div>
      <div class="nav-item active" data-evidence-sample="active-nav-item">
        <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
        <span class="nav-item-label">产品需求讨论</span>
        <span class="nav-item-actions">
          <button class="nav-action-btn" aria-label="更多操作"><i data-lucide="more-horizontal" style="width:16px;height:16px"></i></button>
        </span>
      </div>
      <div class="nav-item" data-evidence-sample="conversation-list-item">
        <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
        <span class="nav-item-label">技术方案评审</span>
        <span class="nav-item-meta">10:30</span>
      </div>
      <div class="nav-item">
        <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
        <span class="nav-item-label">知识库问答优化</span>
        <span class="nav-item-meta">昨天</span>
      </div>
      <div class="nav-section-title" style="margin-top:var(--space-3)">知识库</div>
      <div class="nav-group-header" data-evidence-sample="knowledge-section">
        <i data-lucide="chevron-down" class="chevron"></i>
        <span class="nav-item-icon"><i data-lucide="book-open" style="width:18px;height:18px"></i></span>
        <span class="nav-group-title">产品文档</span>
        <span class="nav-badge">12</span>
      </div>
      <div class="nav-group-children">
        <div class="nav-item">
          <span class="nav-item-icon"><i data-lucide="file-text" style="width:16px;height:16px"></i></span>
          <span class="nav-item-label">需求规格说明</span>
        </div>
        <div class="nav-item">
          <span class="nav-item-icon"><i data-lucide="file-text" style="width:16px;height:16px"></i></span>
          <span class="nav-item-label">用户手册</span>
        </div>
      </div>
      <div class="nav-group-header collapsed">
        <i data-lucide="chevron-down" class="chevron"></i>
        <span class="nav-item-icon"><i data-lucide="database" style="width:18px;height:18px"></i></span>
        <span class="nav-group-title">技术文档</span>
        <span class="nav-badge">8</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="nav-item">
        <span class="nav-item-icon"><i data-lucide="settings" style="width:18px;height:18px"></i></span>
        <span class="nav-item-label">设置</span>
      </div>
      <div class="user-profile">
        <div class="user-avatar">ZK</div>
        <div class="user-info">
          <div class="user-name">张坤</div>
          <div class="user-role">管理员</div>
        </div>
      </div>
    </div>
  </nav>
</div>

<hr class="divider">

<div class="row">
  <span class="label">导航项状态</span>
  <div class="nav-sample-row">
    <div class="nav-item" data-evidence-sample="default-item">
      <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
      <span class="nav-item-label">默认状态</span>
      <span class="nav-item-meta">14:20</span>
    </div>
    <div class="nav-item active" data-evidence-sample="active-item">
      <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
      <span class="nav-item-label">激活状态</span>
    </div>
    <div class="nav-item disabled" data-evidence-sample="disabled-item">
      <span class="nav-item-icon"><i data-lucide="message-square" style="width:18px;height:18px"></i></span>
      <span class="nav-item-label">禁用状态</span>
    </div>
    <div class="nav-item" data-evidence-sample="badge-item">
      <span class="nav-item-icon"><i data-lucide="bell" style="width:18px;height:18px"></i></span>
      <span class="nav-item-label">带徽章</span>
      <span class="nav-badge">3</span>
    </div>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
