<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Goal Tree</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style data-preview-shell>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-base-font-family);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      font-weight: var(--body-base-font-weight);
      letter-spacing: var(--body-base-letter-spacing);
      min-height: 100%;
      overflow-x: hidden;
      max-width: 100%;
    }

    body { padding: var(--spacer-32); }
    img, svg, video, canvas { max-width: 100%; }
    a { color: var(--text-default); text-decoration: none; }
    a:hover { color: var(--text-default-hover); }
    hr { border: 0; border-top: 1px solid var(--border-neutral-l1); margin: var(--spacer-24) 0; }

    .h1 { font-family: var(--heading-2xl-font-family); font-size: var(--heading-2xl-font-size); line-height: var(--heading-2xl-line-height); font-weight: var(--heading-2xl-font-weight); color: var(--text-default); }
    .h2 { font-family: var(--heading-md-font-family); font-size: var(--heading-md-font-size); line-height: var(--heading-md-line-height); font-weight: var(--heading-md-font-weight); color: var(--text-default); }
    .h3 { font-family: var(--heading-sm-font-family); font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .eyebrow { font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: var(--body-xs-letter-spacing); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }

    .row { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; }
    .col { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacer-24); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacer-24); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacer-24); }
    .stack-8 { display: flex; flex-direction: column; gap: var(--spacer-8); }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .stack-16 { display: flex; flex-direction: column; gap: var(--spacer-16); }
    .stack-24 { display: flex; flex-direction: column; gap: var(--spacer-24); }
    .stack-40 { display: flex; flex-direction: column; gap: var(--spacer-40); }

    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }

    @media (max-width: 720px) {
      body { padding: var(--spacer-16); }
      .grid-2,
      .grid-3,
      .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../components-group-c.css" />
  <style>
    body {
      width: min(100%, 1184px);
      margin: 0 auto;
      padding: var(--spacer-40) var(--spacer-32) var(--spacer-48);
    }
    .pv-header {
      margin-bottom: var(--spacer-24);
      padding-bottom: var(--spacer-20);
    }
    .pv-header p { max-width: 920px; }
    .pv-section {
      margin-bottom: var(--spacer-32);
      padding-top: var(--spacer-24);
      border-top: 1px solid var(--border-neutral-l1);
    }
    .pv-header + .pv-section {
      padding-top: 0;
      border-top: 0;
    }
    .pv-section__title {
      margin-bottom: var(--spacer-16);
      letter-spacing: var(--body-md-letter-spacing);
    }
    .size-tag {
      display: inline-flex; align-items: center; padding: 0 var(--spacer-6); height: 18px;
      white-space: nowrap;
      background: var(--bg-overlay-l1); color: var(--text-tertiary);
      border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4);
      font-size: var(--body-xs-font-size); font-family: var(--code-editor-font-family);
      margin-bottom: var(--spacer-12);
    }
    .demo-surface {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-24);
      padding: var(--spacer-24);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      background: var(--bg-base-secondary);
      max-width: 520px;
    }
    .ak-icon { display: inline-grid; place-items: center; width: 16px; height: 16px; }
    .ak-icon svg { width: 100%; height: 100%; display: block; }
    @media (max-width: 760px) {
      body { padding: var(--spacer-24) var(--spacer-16) var(--spacer-40); }
    }

    /* @component-css-start */
    /* ===== Goal Tree ===== */
    .ak-goal-tree {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-4);
      font-family: var(--font-family-default);
      color: var(--text-default);
    }
    .ak-goal-tree__node {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-2);
    }
    .ak-goal-tree__node-head {
      display: flex;
      align-items: center;
      gap: var(--spacer-6);
      padding: var(--spacer-6) var(--spacer-8);
      border-radius: var(--radius-8);
      cursor: pointer;
      user-select: none;
      transition: background .12s ease;
    }
    .ak-goal-tree__node-head:hover { background: var(--bg-overlay-l1); }
    .ak-goal-tree__chevron {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--icon-tertiary);
      display: inline-grid;
      place-items: center;
      transition: transform .15s ease;
    }
    .ak-goal-tree__node.is-open > .ak-goal-tree__node-head .ak-goal-tree__chevron { transform: rotate(90deg); }
    .ak-goal-tree__node.is-leaf .ak-goal-tree__chevron { visibility: hidden; }
    .ak-goal-tree__label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--body-base-font-size);
      color: var(--text-default);
    }
    .ak-goal-tree__node.is-leaf .ak-goal-tree__label { font-size: var(--body-base-font-size); }
    .ak-goal-tree__meta {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: var(--spacer-6);
      font-size: var(--body-sm-font-size);
      color: var(--text-tertiary);
    }
    .ak-goal-tree__progress {
      flex: 0 0 auto;
      width: 48px;
      height: 4px;
      border-radius: var(--radius-full);
      background: var(--bg-overlay-l2);
      overflow: hidden;
    }
    .ak-goal-tree__progress > span {
      display: block;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--bg-brand);
    }
    .ak-goal-tree__children {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-2);
      margin-left: var(--spacer-16);
      padding-left: var(--spacer-8);
      border-left: 1px solid var(--border-neutral-l1);
    }
    .ak-goal-tree__node.is-leaf .ak-goal-tree__node-head { cursor: default; }
    .ak-goal-tree__node.is-leaf .ak-goal-tree__node-head:hover { background: transparent; }
    .ak-goal-tree__node.is-leaf .ak-goal-tree__label { color: var(--text-secondary); }
    .ak-goal-tree__node.is-done .ak-goal-tree__label { color: var(--text-tertiary); text-decoration: line-through; }
    .ak-goal-tree__node.is-active > .ak-goal-tree__node-head {
      background: var(--status-primary-surface-l1);
    }
    .ak-goal-tree__node.is-active > .ak-goal-tree__node-head .ak-goal-tree__label { color: var(--text-brand); font-weight: var(--font-weight-medium); }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="pv-header">
    <h1>Goal Tree · 学习目标树</h1>
    <p>
      学习目标树：递归嵌套的目标层级（目标 → 子目标 → 知识点）。支持展开/收起、进度条、
      当前聚焦（is-active）与已完成（is-done）状态。Apple 风格系统蓝。
    </p>
  </div>

  <!-- ======== Default tree ======== -->
  <div class="pv-section">
    <div class="pv-section__title">默认 · 展开/收起</div>
    <span class="size-tag">open / leaf / active / done</span>
    <div class="demo-surface">
      <div class="ak-goal-tree">
        <div class="ak-goal-tree__node is-open">
          <div class="ak-goal-tree__node-head">
            <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
            <span class="ak-goal-tree__label">机器学习基础</span>
            <span class="ak-goal-tree__meta"><span class="ak-goal-tree__progress"><span style="width:60%"></span></span>60%</span>
          </div>
          <div class="ak-goal-tree__children">
            <div class="ak-goal-tree__node is-open">
              <div class="ak-goal-tree__node-head">
                <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
                <span class="ak-goal-tree__label">监督学习</span>
                <span class="ak-goal-tree__meta"><span class="ak-goal-tree__progress"><span style="width:80%"></span></span>80%</span>
              </div>
              <div class="ak-goal-tree__children">
                <div class="ak-goal-tree__node is-leaf is-done">
                  <div class="ak-goal-tree__node-head">
                    <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
                    <span class="ak-goal-tree__label">线性回归</span>
                    <span class="ak-goal-tree__meta">已完成</span>
                  </div>
                </div>
                <div class="ak-goal-tree__node is-leaf is-active">
                  <div class="ak-goal-tree__node-head">
                    <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
                    <span class="ak-goal-tree__label">过拟合</span>
                    <span class="ak-goal-tree__meta"><span class="ak-goal-tree__progress"><span style="width:40%"></span></span>40%</span>
                  </div>
                </div>
                <div class="ak-goal-tree__node is-leaf">
                  <div class="ak-goal-tree__node-head">
                    <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
                    <span class="ak-goal-tree__label">交叉验证</span>
                    <span class="ak-goal-tree__meta">未开始</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="ak-goal-tree__node is-leaf">
              <div class="ak-goal-tree__node-head">
                <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
                <span class="ak-goal-tree__label">无监督学习</span>
                <span class="ak-goal-tree__meta">未开始</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======== Collapsed ======== -->
  <div class="pv-section">
    <div class="pv-section__title">收起状态</div>
    <span class="size-tag">collapsed</span>
    <div class="demo-surface">
      <div class="ak-goal-tree">
        <div class="ak-goal-tree__node">
          <div class="ak-goal-tree__node-head">
            <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
            <span class="ak-goal-tree__label">深度学习进阶</span>
            <span class="ak-goal-tree__meta"><span class="ak-goal-tree__progress"><span style="width:20%"></span></span>20%</span>
          </div>
        </div>
        <div class="ak-goal-tree__node">
          <div class="ak-goal-tree__node-head">
            <span class="ak-goal-tree__chevron"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 4l4 4-4 4z"/></svg></span></span>
            <span class="ak-goal-tree__label">自然语言处理</span>
            <span class="ak-goal-tree__meta">未开始</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
