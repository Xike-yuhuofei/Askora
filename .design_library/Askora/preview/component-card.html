<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-sans); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; min-width: 92px; padding-top: var(--space-1); flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-rule); margin: var(--space-4) 0; }

/* @component-css-start */
.card { width: 100%; box-sizing: border-box; font-family: var(--font-sans); }
.card--md { border-radius: var(--radius-lg); }
.card--sm { border-radius: var(--radius-md); }
.card--normal { padding: var(--space-4); }
.card--compact { padding: var(--space-3); }
.card--default { background: var(--color-primary); color: var(--color-on-primary); }
.card--elevated { background: var(--color-surface); color: var(--color-on-surface); box-shadow: var(--shadow-1); transition: box-shadow .15s; }
.card--elevated:hover { box-shadow: var(--shadow-2); }
.card--outlined { background: var(--color-surface); color: var(--color-on-surface); border: 1px solid var(--color-border); transition: box-shadow .15s; }
.card--outlined:hover { box-shadow: var(--shadow-1); }
.card--ghost { background: transparent; color: var(--color-on-surface); transition: background .15s; }
.card--ghost:hover { background: var(--color-surface-container); }
.card__title { font-size: var(--font-size-body); font-weight: 600; margin: 0 0 var(--space-2) 0; }
.card__text { font-size: var(--font-size-body); line-height: var(--line-height-body); margin: 0; }
.card__meta { font-size: var(--font-size-caption); color: var(--color-muted-foreground); margin-top: var(--space-2); }
.card__tag { display: inline-block; font-size: var(--font-size-caption); padding: 2px var(--space-2); border-radius: var(--radius-full); background: var(--color-surface-container); color: var(--color-on-surface-variant); }
.card__header { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.card__avatar { width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-on-primary); display: flex; align-items: center; justify-content: center; font-size: var(--font-size-caption); font-weight: 600; flex-shrink: 0; }
.card__footer { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-3); }
.card__actions { display: flex; gap: var(--space-1); }
.card__action-btn { background: none; border: none; color: var(--color-muted-foreground); cursor: pointer; font-size: var(--font-size-caption); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); transition: background .15s, color .15s; }
.card__action-btn:hover { color: var(--color-on-surface); background: var(--color-surface-container); }
.card__unread { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-primary); flex-shrink: 0; }
.card--default .card__meta { color: rgba(255,255,255,0.7); }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">助手消息</span>
  <div class="card card--elevated card--md card--normal" data-evidence-sample="assistant-message">
    <div class="card__header">
      <div class="card__avatar" aria-hidden="true">AI</div>
      <span class="card__title" style="margin:0;">Askora 助手</span>
    </div>
    <p class="card__text">您好，我是 Askora 智能助手，可以帮您检索知识库中的信息并回答问题。请问有什么可以帮助您的？</p>
    <div class="card__footer">
      <span class="card__meta">刚刚</span>
      <div class="card__actions">
        <button class="card__action-btn" type="button">复制</button>
        <button class="card__action-btn" type="button">点赞</button>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <span class="label">用户消息</span>
  <div class="card card--default card--md card--normal" data-evidence-sample="user-message">
    <p class="card__text">请帮我总结一下产品定价方案的核心区别。</p>
    <div class="card__footer">
      <span class="card__meta">10:24</span>
    </div>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">知识卡片</span>
  <div class="card card--outlined card--md card--normal" data-evidence-sample="knowledge-card">
    <span class="card__tag">知识库</span>
    <h3 class="card__title" style="margin-top: var(--space-2);">产品定价方案说明</h3>
    <p class="card__text">企业版包含无限知识库容量、高级权限管理和专属客户成功支持，适合 50 人以上团队使用。</p>
    <div class="card__meta">来源：产品手册 · 2 天前更新</div>
  </div>
</div>

<div class="row">
  <span class="label">侧边栏条目</span>
  <div class="card card--ghost card--sm card--compact" data-evidence-sample="sidebar-item">
    <div style="display: flex; align-items: center; gap: var(--space-2);">
      <span class="card__text" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">新产品功能需求讨论</span>
      <span class="card__meta" style="margin-top: 0; flex-shrink: 0;">昨天</span>
      <div class="card__unread" aria-label="未读消息"></div>
    </div>
  </div>
</div>

</body>
</html>
