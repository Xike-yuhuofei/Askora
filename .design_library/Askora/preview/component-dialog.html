<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Dialog</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style data-preview-shell>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-base-font-family);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      font-weight: var(--body-base-font-weight);
      letter-spacing: var(--body-base-letter-spacing);
      min-height: 100%;
      overflow-x: hidden;
      max-width: 100%;
    }

    body { padding: var(--spacer-32); }
    img, svg, video, canvas { max-width: 100%; }
    a { color: var(--text-default); text-decoration: none; }
    a:hover { color: var(--text-default-hover); }
    hr { border: 0; border-top: 1px solid var(--border-neutral-l1); margin: var(--spacer-24) 0; }

    .h1 { font-family: var(--heading-2xl-font-family); font-size: var(--heading-2xl-font-size); line-height: var(--heading-2xl-line-height); font-weight: var(--heading-2xl-font-weight); color: var(--text-default); }
    .h2 { font-family: var(--heading-md-font-family); font-size: var(--heading-md-font-size); line-height: var(--heading-md-line-height); font-weight: var(--heading-md-font-weight); color: var(--text-default); }
    .h3 { font-family: var(--heading-sm-font-family); font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .eyebrow { font-size: var(--body-sm-font-size); line-height: var(--body-sm-line-height); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: var(--body-sm-letter-spacing); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }

    .row { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; }
    .col { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacer-24); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacer-24); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacer-24); }
    .stack-8 { display: flex; flex-direction: column; gap: var(--spacer-8); }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .stack-16 { display: flex; flex-direction: column; gap: var(--spacer-16); }
    .stack-24 { display: flex; flex-direction: column; gap: var(--spacer-24); }
    .stack-40 { display: flex; flex-direction: column; gap: var(--spacer-40); }

    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }

    @media (max-width: 720px) {
      body { padding: var(--spacer-16); }
      .grid-2,
      .grid-3,
      .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../components-group-a.css" />
  <link rel="stylesheet" href="../components-group-b.css" />
  <style>
    body {
      width: min(100%, 1184px);
      margin: 0 auto;
      padding: var(--spacer-40) var(--spacer-32) var(--spacer-48);
    }
    .pv-header { margin-bottom: var(--spacer-24); padding-bottom: var(--spacer-20); }
    .pv-header p { max-width: 920px; }
    .pv-section { margin-bottom: var(--spacer-32); padding-top: var(--spacer-24); border-top: 1px solid var(--border-neutral-l1); }
    .pv-header + .pv-section { padding-top: 0; border-top: 0; }
    .pv-section__title { margin-bottom: var(--spacer-16); letter-spacing: var(--body-md-letter-spacing); }

    /* @component-css-start */
    /* ===== Dialog / Modal ===== */
    .ak-backdrop { position: relative; background: var(--bg-overlay-l4); border: 1px solid var(--border-neutral-l1); padding: var(--spacer-32) var(--spacer-24); display: flex; align-items: center; justify-content: center; }
    .ak-dialog { background: var(--bg-base-default); border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-12); width: 100%; max-width: 520px; overflow: hidden; color: var(--text-default); box-shadow: 0 24px 64px color-mix(in srgb, var(--text-default) 14%, transparent), 0 4px 16px color-mix(in srgb, var(--text-default) 8%, transparent); }
    .ak-dialog--form { max-width: 560px; }
    .ak-dialog__head { padding: var(--spacer-16) var(--spacer-20); display: flex; align-items: center; justify-content: space-between; border-bottom: 0; }
    .ak-dialog__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .ak-dialog__close { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--icon-secondary); cursor: pointer; border-radius: var(--radius-8); }
    .ak-dialog__close:hover { background: var(--bg-overlay-l2); color: var(--icon-default); }
    .ak-dialog__body { padding: var(--spacer-16) var(--spacer-20); color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .ak-dialog__foot { padding: var(--spacer-12) var(--spacer-20); display: flex; justify-content: flex-end; gap: var(--spacer-8); border-top: 0; }
    /* @component-css-end */

    [data-asset-icon] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      -webkit-mask: none !important;
      mask: none !important;
    }
    [data-asset-icon] > svg { display: block; width: 100%; height: 100%; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div class="pv-header">
    <h1>Dialog / Modal</h1>
    <p>表面使用 <code>--bg-base-default</code>，圆角 <code>--radius-12</code>。宽度 520 / 560。遮罩使用 <code>--bg-overlay-l4</code>。</p>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">确认对话框</div>
    <div class="ak-backdrop" style="border-radius: var(--radius-8);">
      <div class="ak-dialog">
        <div class="ak-dialog__head">
          <span class="ak-dialog__title">删除学习计划</span>
          <button class="ak-dialog__close" aria-label="关闭"><span class="icon" style="width: 16px; height: 16px;" aria-hidden="true" data-asset-icon=""><svg focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12.196 2.862a.667.667 0 0 1 .942.943L8.943 7.999l4.195 4.196a.667.667 0 0 1-.942.942L8 8.943l-4.195 4.194a.667.667 0 1 1-.943-.942L7.057 8 2.862 3.805a.667.667 0 1 1 .943-.943L8 7.057l4.196-4.195Z"/></svg></span></button>
        </div>
        <div class="ak-dialog__body">
          此操作无法撤销。学习计划 <span style="color:var(--text-default);">「每日复习」</span> 及其全部进度将被永久删除。
        </div>
        <div class="ak-dialog__foot">
          <button class="ak-btn ak-btn--ghost">取消</button>
          <button class="ak-btn ak-btn--danger">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="pv-section">
    <div class="pv-section__title">表单对话框</div>
    <div class="ak-backdrop" style="border-radius: var(--radius-8);">
      <div class="ak-dialog ak-dialog--form">
        <div class="ak-dialog__head">
          <span class="ak-dialog__title">邀请协作者</span>
          <button class="ak-dialog__close" aria-label="关闭"><span class="icon" style="width: 16px; height: 16px;" aria-hidden="true" data-asset-icon=""><svg focusable="false" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12.196 2.862a.667.667 0 0 1 .942.943L8.943 7.999l4.195 4.196a.667.667 0 0 1-.942.942L8 8.943l-4.195 4.194a.667.667 0 1 1-.943-.942L7.057 8 2.862 3.805a.667.667 0 1 1 .943-.943L8 7.057l4.196-4.195Z"/></svg></span></button>
        </div>
        <div class="ak-dialog__body">
          邀请将发送到该邮箱，对方可查看并编辑此知识库的共享内容。
        </div>
        <div class="ak-dialog__foot">
          <button class="ak-btn ak-btn--ghost">取消</button>
          <button class="ak-btn ak-btn--primary">发送邀请</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
