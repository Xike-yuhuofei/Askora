<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input - Askora</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-sans); color: var(--color-on-surface); font-size: var(--font-size-body); }
.row { display: flex; gap: var(--space-2); align-items: flex-start; margin-bottom: var(--space-3); flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); color: var(--color-muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; width: 92px; flex-shrink: 0; padding-top: 10px; }
.divider { border: none; border-top: 1px solid var(--color-rule); margin: var(--space-5) 0; }

/* @component-css-start */
.input { display: flex; flex-direction: column; gap: var(--space-1); min-width: 240px; flex-shrink: 0; }
.input-label { font-size: var(--font-size-body); color: var(--color-on-surface); font-weight: 500; }
.input-field { height: var(--size-input-height); padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-on-surface); font-family: var(--font-sans); font-size: var(--font-size-body); transition: border-color .15s; outline: none; width: 100%; box-sizing: border-box; }
.input-field::placeholder { color: var(--color-muted-foreground); }
.input-field:hover { border-color: var(--color-muted-foreground); }
.input-field:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,122,255,.15); }
.input-helper { font-size: var(--font-size-caption); color: var(--color-muted-foreground); }
.input-error .input-field { border-color: var(--color-error); }
.input-error .input-field:focus { box-shadow: 0 0 0 3px rgba(255,59,48,.15); }
.input-error-text { font-size: var(--font-size-caption); color: var(--color-error); display: flex; align-items: center; gap: var(--space-1); }
.input-disabled .input-field { background: var(--color-surface-container); color: var(--color-muted-foreground); cursor: not-allowed; }
.input-search { position: relative; min-width: 240px; flex-shrink: 0; max-width: 320px; width: 100%; }
.input-search .input-field { padding-left: 40px; border: none; border-radius: var(--radius-full); background: var(--color-surface-container); }
.input-search .input-field:hover { background: var(--color-surface-container-high); }
.input-search .input-field:focus { background: var(--color-surface); box-shadow: 0 0 0 2px var(--color-primary); }
.input-search-icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--color-muted-foreground); width: var(--size-icon-md); height: var(--size-icon-md); }
.input-chat { display: flex; align-items: flex-end; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--color-surface); min-height: 48px; min-width: 320px; max-width: 100%; flex-shrink: 0; transition: border-color .15s; }
.input-chat:hover { border-color: var(--color-muted-foreground); }
.input-chat:focus-within { border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(0,122,255,.15); }
.input-chat-attach { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; background: transparent; color: var(--color-muted-foreground); cursor: pointer; border-radius: var(--radius-full); flex-shrink: 0; transition: background .15s; }
.input-chat-attach:hover { background: var(--color-surface-container); }
.input-chat-textarea { flex: 1; border: none; outline: none; background: transparent; color: var(--color-on-surface); font-family: var(--font-sans); font-size: var(--font-size-body); resize: none; min-height: 24px; max-height: 120px; line-height: 1.5; padding: 4px 0; min-width: 0; }
.input-chat-textarea::placeholder { color: var(--color-muted-foreground); }
.input-chat-send { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: none; background: var(--color-primary); color: var(--color-on-primary); cursor: pointer; border-radius: var(--radius-full); flex-shrink: 0; transition: background .15s; }
.input-chat-send:hover { background: var(--color-primary-hover); }
/* @component-css-end */
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="icon-alert-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
  <symbol id="icon-paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 17.93 8.8l-8.58 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
</svg>

<div class="row">
  <span class="label">默认</span>
  <div class="input" data-evidence-sample="Text Input MD">
    <label class="input-label">知识库名称</label>
    <input type="text" class="input-field" placeholder="请输入名称">
  </div>
</div>

<div class="row">
  <span class="label">辅助文字</span>
  <div class="input">
    <label class="input-label">显示名称</label>
    <input type="text" class="input-field" placeholder="请输入显示名称" value="产品知识库">
    <span class="input-helper">最长 50 个字符</span>
  </div>
</div>

<div class="row">
  <span class="label">错误</span>
  <div class="input input-error" data-evidence-sample="Text Input Error">
    <label class="input-label">邮箱地址</label>
    <input type="text" class="input-field" value="invalid-email">
    <span class="input-error-text"><svg width="14" height="14"><use href="#icon-alert-circle"/></svg>请输入有效的邮箱地址</span>
  </div>
</div>

<div class="row">
  <span class="label">禁用</span>
  <div class="input input-disabled">
    <label class="input-label">API 密钥</label>
    <input type="text" class="input-field" value="sk-********" disabled>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">搜索</span>
  <div class="input-search" data-evidence-sample="Search Input">
    <svg class="input-search-icon"><use href="#icon-search"/></svg>
    <input type="text" class="input-field" placeholder="搜索对话或知识库...">
  </div>
</div>

<div class="row">
  <span class="label">聊天输入</span>
  <div class="input-chat" data-evidence-sample="Chat Input">
    <button class="input-chat-attach" type="button" aria-label="添加附件">
      <svg width="18" height="18"><use href="#icon-paperclip"/></svg>
    </button>
    <textarea class="input-chat-textarea" rows="1" placeholder="输入消息，Shift+Enter 换行"></textarea>
    <button class="input-chat-send" type="button" aria-label="发送">
      <svg width="16" height="16"><use href="#icon-send"/></svg>
    </button>
  </div>
</div>

</body>
</html>
