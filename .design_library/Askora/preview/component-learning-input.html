<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Learning Input</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../colors_and_type.css" />
  <style data-preview-shell>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      background: var(--bg-base-default);
      color: var(--text-default);
      font-family: var(--body-base-font-family);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      font-weight: var(--body-base-font-weight);
      letter-spacing: var(--body-base-letter-spacing);
      min-height: 100%;
      overflow-x: hidden;
      max-width: 100%;
    }

    body { padding: var(--spacer-32); }
    img, svg, video, canvas { max-width: 100%; }
    a { color: var(--text-default); text-decoration: none; }
    a:hover { color: var(--text-default-hover); }
    hr { border: 0; border-top: 1px solid var(--border-neutral-l1); margin: var(--spacer-24) 0; }

    .h1 { font-family: var(--heading-2xl-font-family); font-size: var(--heading-2xl-font-size); line-height: var(--heading-2xl-line-height); font-weight: var(--heading-2xl-font-weight); color: var(--text-default); }
    .h2 { font-family: var(--heading-md-font-family); font-size: var(--heading-md-font-size); line-height: var(--heading-md-line-height); font-weight: var(--heading-md-font-weight); color: var(--text-default); }
    .h3 { font-family: var(--heading-sm-font-family); font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); color: var(--text-default); }
    .eyebrow { font-size: var(--body-xs-font-size); line-height: var(--body-xs-line-height); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: var(--body-xs-letter-spacing); }
    .text-secondary { color: var(--text-secondary); }
    .text-tertiary { color: var(--text-tertiary); }

    .row { display: flex; gap: var(--spacer-12); flex-wrap: wrap; align-items: center; }
    .col { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacer-24); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacer-24); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacer-24); }
    .stack-8 { display: flex; flex-direction: column; gap: var(--spacer-8); }
    .stack-12 { display: flex; flex-direction: column; gap: var(--spacer-12); }
    .stack-16 { display: flex; flex-direction: column; gap: var(--spacer-16); }
    .stack-24 { display: flex; flex-direction: column; gap: var(--spacer-24); }
    .stack-40 { display: flex; flex-direction: column; gap: var(--spacer-40); }

    .pv-header { margin-bottom: var(--spacer-32); padding-bottom: var(--spacer-16); border-bottom: 1px solid var(--border-neutral-l1); }
    .pv-header h1 { font-size: var(--heading-lg-font-size); line-height: var(--heading-lg-line-height); font-weight: var(--heading-lg-font-weight); margin-bottom: var(--spacer-4); }
    .pv-header p { color: var(--text-secondary); font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); }
    .pv-section { margin-bottom: var(--spacer-32); }
    .pv-section__title { font-size: var(--heading-sm-font-size); line-height: var(--heading-sm-line-height); font-weight: var(--heading-sm-font-weight); margin-bottom: var(--spacer-12); color: var(--text-default); }
    .pv-section__sub { font-size: var(--body-base-font-size); line-height: var(--body-base-line-height); color: var(--text-tertiary); margin-bottom: var(--spacer-12); }

    @media (max-width: 720px) {
      body { padding: var(--spacer-16); }
      .grid-2,
      .grid-3,
      .grid-4 { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../components-group-c.css" />
  <style>
    body {
      width: min(100%, 1184px);
      margin: 0 auto;
      padding: var(--spacer-40) var(--spacer-32) var(--spacer-48);
    }
    .pv-header {
      margin-bottom: var(--spacer-24);
      padding-bottom: var(--spacer-20);
    }
    .pv-header p { max-width: 920px; }
    .pv-section {
      margin-bottom: var(--spacer-32);
      padding-top: var(--spacer-24);
      border-top: 1px solid var(--border-neutral-l1);
    }
    .pv-header + .pv-section {
      padding-top: 0;
      border-top: 0;
    }
    .pv-section__title {
      margin-bottom: var(--spacer-16);
      letter-spacing: var(--body-md-letter-spacing);
    }
    .size-tag {
      display: inline-flex; align-items: center; padding: 0 var(--spacer-6); height: 18px;
      white-space: nowrap;
      background: var(--bg-overlay-l1); color: var(--text-tertiary);
      border: 1px solid var(--border-neutral-l1); border-radius: var(--radius-4);
      font-size: var(--body-xs-font-size); font-family: var(--code-editor-font-family);
      margin-bottom: var(--spacer-12);
    }
    .demo-surface {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-24);
      padding: var(--spacer-24);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-12);
      background: var(--bg-base-default);
    }
    .ak-icon { display: inline-grid; place-items: center; width: 16px; height: 16px; }
    .ak-icon svg { width: 100%; height: 100%; display: block; }
    @media (max-width: 760px) {
      body { padding: var(--spacer-24) var(--spacer-16) var(--spacer-40); }
    }

    /* @component-css-start */
    /* ===== Learning Input ===== */
    .ak-learning-input {
      display: flex;
      flex-direction: column;
      gap: var(--spacer-8);
      max-width: 720px;
      margin: 0 auto;
    }
    .ak-learning-input__box {
      display: flex;
      flex-direction: column;
      background: var(--bg-base-secondary);
      border: 1px solid var(--border-neutral-l2);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-2);
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    .ak-learning-input__box:focus-within {
      border-color: var(--border-brand);
      box-shadow: 0 0 0 3px var(--status-primary-surface-l1), var(--shadow-2);
    }
    .ak-learning-input__textarea {
      width: 100%;
      min-height: 72px;
      max-height: 220px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text-default);
      font-family: var(--font-family-default);
      font-size: var(--body-base-font-size);
      line-height: var(--body-base-line-height);
      padding: var(--spacer-16) var(--spacer-16) var(--spacer-8);
    }
    .ak-learning-input__textarea::placeholder { color: var(--text-tertiary); }
    .ak-learning-input__toolbar {
      display: flex;
      align-items: center;
      gap: var(--spacer-4);
      padding: var(--spacer-8) var(--spacer-12) var(--spacer-12);
    }
    .ak-learning-input__action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-8);
      color: var(--icon-tertiary);
      cursor: pointer;
      user-select: none;
      border: none;
      background: transparent;
      transition: background .12s ease, color .12s ease;
    }
    .ak-learning-input__action:hover { background: var(--bg-overlay-l1); color: var(--icon-default); }
    .ak-learning-input__action.is-active { color: var(--icon-brand); background: var(--status-primary-surface-l1); }
    .ak-learning-input__spacer { flex: 1; }
    .ak-learning-input__send {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacer-6);
      height: 28px;
      padding: 0 var(--spacer-12);
      border-radius: var(--radius-8);
      background: var(--bg-brand);
      color: var(--text-onbrand);
      border: 1px solid var(--bg-brand);
      font-family: var(--body-base-strong-font-family);
      font-size: var(--body-base-strong-font-size);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      user-select: none;
      transition: background .12s ease, border-color .12s ease;
    }
    .ak-learning-input__send:hover { background: var(--bg-brand-hover); border-color: var(--bg-brand-hover); }
    .ak-learning-input__send:active { background: var(--bg-brand-active); border-color: var(--bg-brand-active); }
    .ak-learning-input__send[disabled] { background: var(--bg-brand-disabled); border-color: transparent; color: var(--text-onbrand); cursor: not-allowed; }
    .ak-learning-input__hint {
      font-size: var(--body-sm-font-size);
      color: var(--text-tertiary);
      text-align: center;
    }
    .ak-learning-input__hint kbd {
      font-family: var(--font-family-mono);
      font-size: var(--body-sm-font-size);
      color: var(--text-secondary);
      background: var(--bg-overlay-l1);
      border: 1px solid var(--border-neutral-l1);
      border-radius: var(--radius-4);
      padding: 0 var(--spacer-4);
    }
    /* @component-css-end */
  </style>
</head>
<body>
  <div class="pv-header">
    <h1>Learning Input · 学习对话输入框</h1>
    <p>
      学习对话输入框：多行文本域 + 工具栏（附件/引用）+ 发送按钮。聚焦时显示系统蓝柔光描边。
      Enter 发送，Shift+Enter 换行。Apple 风格系统蓝。
    </p>
  </div>

  <!-- ======== Default ======== -->
  <div class="pv-section">
    <div class="pv-section__title">默认状态</div>
    <span class="size-tag">默认</span>
    <div class="demo-surface">
      <div class="ak-learning-input">
        <div class="ak-learning-input__box">
          <textarea class="ak-learning-input__textarea" placeholder="输入你的问题，或描述想学习的内容…"></textarea>
          <div class="ak-learning-input__toolbar">
            <button class="ak-learning-input__action" type="button" aria-label="添加附件"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a1 1 0 011 1v6a2 2 0 01-4 0V4a1 1 0 012 0v5a0 0 0 000 0 0 0 0 000 0V3a1 1 0 011-1zM4 8a4 4 0 008 0V4a1 1 0 012 0v4a6 6 0 01-12 0V4a1 1 0 012 0v4z"/></svg></span></button>
            <button class="ak-learning-input__action" type="button" aria-label="引用材料"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zM2 7h8v2H2zM2 11h12v2H2z"/></svg></span></button>
            <span class="ak-learning-input__spacer"></span>
            <button class="ak-learning-input__send" type="button" disabled>发送</button>
          </div>
        </div>
        <div class="ak-learning-input__hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</div>
      </div>
    </div>
  </div>

  <!-- ======== Focus ======== -->
  <div class="pv-section">
    <div class="pv-section__title">聚焦状态</div>
    <span class="size-tag">focus-within</span>
    <div class="demo-surface">
      <div class="ak-learning-input">
        <div class="ak-learning-input__box" style="border-color:var(--border-brand);box-shadow:0 0 0 3px var(--status-primary-surface-l1),var(--shadow-2);">
          <textarea class="ak-learning-input__textarea" placeholder="请解释梯度下降的直观含义…"></textarea>
          <div class="ak-learning-input__toolbar">
            <button class="ak-learning-input__action is-active" type="button" aria-label="引用材料"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zM2 7h8v2H2zM2 11h12v2H2z"/></svg></span></button>
            <span class="ak-learning-input__spacer"></span>
            <button class="ak-learning-input__send" type="button">发送</button>
          </div>
        </div>
        <div class="ak-learning-input__hint"><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd> + <kbd>Enter</kbd> 换行</div>
      </div>
    </div>
  </div>

  <!-- ======== Disabled send ======== -->
  <div class="pv-section">
    <div class="pv-section__title">空内容 · 禁用发送</div>
    <span class="size-tag">disabled</span>
    <div class="demo-surface">
      <div class="ak-learning-input">
        <div class="ak-learning-input__box">
          <textarea class="ak-learning-input__textarea" placeholder=""></textarea>
          <div class="ak-learning-input__toolbar">
            <button class="ak-learning-input__action" type="button" aria-label="添加附件"><span class="ak-icon"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 2a1 1 0 011 1v6a2 2 0 01-4 0V4a1 1 0 012 0v5a0 0 0 000 0 0 0 0 000 0V3a1 1 0 011-1zM4 8a4 4 0 008 0V4a1 1 0 012 0v4a6 6 0 01-12 0V4a1 1 0 012 0v4z"/></svg></span></button>
            <span class="ak-learning-input__spacer"></span>
            <button class="ak-learning-input__send" type="button" disabled>发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
